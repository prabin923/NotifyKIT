services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_platform
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_platform?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      # Keep browser CORS aligned with the dashboard port, including an
      # alternate local port selected through DASHBOARD_PORT.
      DASHBOARD_URL: ${DASHBOARD_ORIGIN:-http://localhost:${DASHBOARD_PORT:-3001}}
      CORS_ORIGINS: ${DASHBOARD_ORIGIN:-http://localhost:${DASHBOARD_PORT:-3001}}
    # Compose is the local-development stack and may reuse a volume created
    # before migration history existed. `db push` safely synchronizes that
    # schema; production deployments should run `prisma migrate deploy`.
    command: sh -c "npx prisma db push --skip-generate --schema prisma/schema.prisma && exec node apps/api/dist/main.js"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_platform?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Browser calls stay on the dashboard origin; the Next.js proxy below
        # forwards them over the Compose network to the API container.
        NEXT_PUBLIC_API_URL: /api/proxy
    environment:
      API_INTERNAL_URL: http://api:3000
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
