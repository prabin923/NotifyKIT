name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - name: Lint / typecheck
        run: npm run lint --workspaces --if-present
      - name: Unit tests
        run: npm run test -w @notification-platform/api
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
          POSTGRES_DB: notification_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notification -d notification_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # The e2e suite reads TEST_DATABASE_URL (see apps/api/test/setup-e2e.ts)
      # so a local run can never touch a real database by accident; DATABASE_URL
      # is set to the same value for the `prisma migrate deploy` step below.
      DATABASE_URL: postgresql://notification:notification@localhost:5432/notification_platform?schema=public
      TEST_DATABASE_URL: postgresql://notification:notification@localhost:5432/notification_platform?schema=public
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      # validateConfiguration() in apps/api/src/app.ts requires these; values
      # below are fake and only ever used against the ephemeral CI services.
      JWT_SECRET: fake-ci-jwt-secret-that-is-at-least-32-characters-long
      API_KEY_PEPPER: fake-ci-api-key-pepper-24chars
      WEBHOOK_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - name: Apply migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: E2E tests
        run: npm run test:e2e -w @notification-platform/api
