<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NotifyKIT inbox widget — example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #0f172a;
      color: #fff;
    }
    header h1 { font-size: 16px; margin: 0; }
    main { max-width: 640px; margin: 40px auto; padding: 0 24px; }
    label { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    #log {
      margin-top: 24px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Acme Dashboard (host app)</h1>
    <!--
      This is the whole integration: one script tag + one custom element.
      Fill in the fields below and click "Apply" to point it at a real deployment
      (mint a token first with the curl command in this package's README).
    -->
    <notifykit-inbox id="inbox" poll-interval="30000" theme="auto"></notifykit-inbox>
  </header>

  <main>
    <p>This page simulates a host application embedding the NotifyKIT inbox widget in its
      top bar. Configure it against a running deployment:</p>

    <label>
      End-user token
      <input id="token-input" placeholder="eyJhbGciOi..." />
    </label>
    <label>
      Base URL (leave blank for same-origin)
      <input id="base-url-input" placeholder="https://api.your-notifykit-host.example" />
    </label>
    <button id="apply">Apply</button>

    <div id="log">Waiting for notifykit:* events…</div>
  </main>

  <!-- In production, point this at your own hosted copy of dist/inbox-widget.iife.js. -->
  <script src="../dist/inbox-widget.iife.js"></script>
  <script>
    const inbox = document.getElementById('inbox');
    const log = document.getElementById('log');

    function append(line) {
      log.textContent = `${new Date().toLocaleTimeString()}  ${line}\n${log.textContent}`;
    }

    inbox.addEventListener('notifykit:open', (event) => append(`open: ${JSON.stringify(event.detail)}`));
    inbox.addEventListener('notifykit:count', (event) => append(`count: ${JSON.stringify(event.detail)}`));
    inbox.addEventListener('notifykit:select', (event) => append(`select: ${event.detail.title}`));

    document.getElementById('apply').addEventListener('click', () => {
      inbox.token = document.getElementById('token-input').value.trim();
      inbox.baseUrl = document.getElementById('base-url-input').value.trim();
      append('applied token/base-url');
    });
  </script>
</body>
</html>
